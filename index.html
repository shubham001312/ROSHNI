<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday, Roshni 🎀</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #ffe6ea 0%, #ffb6c1 100%); 
            min-height: 100vh; 
            font-family: 'Quicksand', sans-serif; 
            color: #6a0d45; 
            overflow-x: hidden;
            display: flex; flex-direction: column;
        }
        
        /* Glassy Navigation */
        nav { 
            position: fixed; top: 0; width: 100%; padding: 20px; 
            display: flex; justify-content: center; gap: 30px; z-index: 100; 
            background: rgba(255, 255, 255, 0.3); 
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
        }
        nav a { 
            color: #d81b60; text-decoration: none; font-weight: 700; font-size: 1.1rem;
            padding: 10px 25px; border-radius: 30px; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        nav a:hover, nav a.active { 
            background: rgba(255, 255, 255, 0.7); 
            box-shadow: 0 8px 20px rgba(216, 27, 96, 0.15);
            transform: translateY(-2px);
        }

        /* Hero Section */
        .hero { 
            flex: 1; display: flex; justify-content: center; align-items: center; 
            padding: 100px 20px 20px; position: relative;
        }
        
        /* Floating Bubbles/Circles for Cute Vibe */
        .bubble {
            position: absolute; border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            animation: float 6s infinite ease-in-out;
            z-index: -1;
        }
        .b1 { width: 100px; height: 100px; top: 20%; left: 15%; animation-delay: 0s; }
        .b2 { width: 150px; height: 150px; bottom: 20%; right: 10%; animation-delay: 2s; }
        .b3 { width: 60px; height: 60px; top: 40%; right: 25%; animation-delay: 4s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(10deg); }
        }

        /* Glassmorphism Card */
        .glass-card { 
            text-align: center; padding: 60px 40px; border-radius: 30px; max-width: 700px; width: 100%;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 15px 35px rgba(216, 27, 96, 0.1);
            animation: popIn 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8) translateY(30px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        h1 { 
            font-family: 'Pacifico', cursive; font-size: clamp(3rem, 8vw, 5rem); 
            color: #d81b60; margin-bottom: 15px; 
            text-shadow: 2px 2px 4px rgba(255,255,255,0.8);
        }
        .subtitle { 
            font-size: 1.3rem; font-weight: 600; color: #882d5a; margin-bottom: 40px; 
            letter-spacing: 2px; text-transform: uppercase;
        }
        
        /* Cute Translucent Button */
        .btn { 
            display: inline-block; padding: 15px 40px; border-radius: 40px;
            background: rgba(255, 255, 255, 0.4); border: 2px solid #ffffff;
            color: #d81b60; text-decoration: none; font-weight: 700; font-size: 1.1rem;
            letter-spacing: 1px; transition: all 0.4s ease;
            box-shadow: 0 8px 25px rgba(216, 27, 96, 0.2);
            position: relative; overflow: hidden;
        }
        .btn::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
            transition: all 0.6s ease;
        }
        .btn:hover::before { left: 100%; }
        .btn:hover { 
            background: #d81b60; color: #fff; border-color: #d81b60;
            transform: translateY(-5px) scale(1.05); box-shadow: 0 12px 30px rgba(216, 27, 96, 0.4);
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="active">Home</a>
        <a href="message.html">Message</a>
        <a href="gallery.html">Gallery</a>
    </nav>

    <section class="hero">
        <div class="bubble b1"></div>
        <div class="bubble b2"></div>
        <div class="bubble b3"></div>
        
        <div class="glass-card">
            <h1>Happy Birthday<br>Roshni 🌸</h1>
            <p class="subtitle">Wishing the sweetest girl the best day!</p>
            <a href="message.html" class="btn">Read Your Message ✨</a>
        </div>
    </section>
</body>
</html>
